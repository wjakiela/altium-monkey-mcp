[project]
name = "altium-monkey-mcp"
version = "0.1.0"
description = "Read-only MCP server for Altium Designer projects (schematic, netlist, BOM, PCB, rendering) - no Altium required"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "altium-monkey>=2026.9.22",
    "mcp>=2.3,<3",
]
keywords = ["altium", "mcp", "pcb", "schematic", "eda", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/wjakiela/altium-monkey-mcp"

[project.scripts]
altium-monkey-mcp = "altium_monkey_mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["altium_monkey_mcp"]
